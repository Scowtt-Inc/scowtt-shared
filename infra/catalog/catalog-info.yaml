# Backstage / TF-catalog descriptor.
# Registering this file in your catalog publishes the modules under
# `infra/modules/aws/` as reusable, versioned Terraform components.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: aws-datasync-s3-to-gcs
  title: AWS DataSync — S3 → GCS (per-tenant)
  description: >
    Reusable OpenTofu module that provisions a per-tenant AWS DataSync task
    syncing an S3 prefix to a Google Cloud Storage bucket via the GCS S3
    interoperability API (HMAC). ENHANCED-mode, hourly schedule, OIDC-based
    GitHub Actions delivery.
  tags: [terraform, opentofu, aws, datasync, gcs, tf-catalog]
  links:
    - url: ../modules/aws/datasync-s3-to-gcs/README.md
      title: Module README
    - url: ../bootstrap/aws/README.md
      title: AWS bootstrap procedure
  annotations:
    backstage.io/source-location: dir:../modules/aws/datasync-s3-to-gcs
    terraform/module-source: git::https://github.com/Scowtt-Inc/scowtt-shared.git//infra/modules/aws/datasync-s3-to-gcs
spec:
  type: terraform-module
  lifecycle: production
  owner: aws-leads
  system: data-platform
  dependsOn:
    - resource:default/scowtt-crm-data-bucket-dev
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: data-platform
  description: Cross-cloud data sync and storage.
spec:
  owner: aws-leads
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: scowtt-crm-data-bucket-dev
  title: S3 bucket — scowtt-crm-data-bucket-dev
  description: Source S3 bucket for tenant CRM data. Read by the DataSync task per-tenant prefix.
spec:
  type: s3-bucket
  owner: aws-leads
  system: data-platform
