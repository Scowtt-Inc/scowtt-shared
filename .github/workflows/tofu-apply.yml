name: tofu-apply

on:
  push:
    branches: [main]
    paths:
      - "infra/modules/aws/**"
      - "infra/stacks/aws/**"
      - ".github/workflows/tofu-apply.yml"
  workflow_dispatch:
    inputs:
      tenant:
        description: "Tenant directory under infra/stacks/aws/datasync/tenants/ (blank = apply all changed)"
        required: false
        type: string

permissions: {}

concurrency:
  group: tofu-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tenants: ${{ steps.set.outputs.tenants }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: set
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.tenant }}" ]; then
            json=$(printf '["%s"]' "${{ github.event.inputs.tenant }}")
            echo "tenants=$json" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only HEAD~1 HEAD || git ls-files infra/stacks/aws/datasync/tenants)

          if echo "$changed" | grep -qE '^(infra/modules/aws/|\.github/)'; then
            mapfile -t tenants < <(find infra/stacks/aws/datasync/tenants -mindepth 1 -maxdepth 1 -type d ! -name '_template' -printf '%f\n' | sort)
          else
            mapfile -t tenants < <(echo "$changed" | grep -E '^infra/stacks/aws/datasync/tenants/[^/]+/' | awk -F/ '$6!="_template"{print $6}' | sort -u)
          fi

          if [ "${#tenants[@]}" -eq 0 ]; then
            echo "tenants=[]" >> "$GITHUB_OUTPUT"
          else
            json=$(printf '%s\n' "${tenants[@]}" | jq -R . | jq -sc .)
            echo "tenants=$json" >> "$GITHUB_OUTPUT"
          fi

  apply-tenant:
    needs: discover
    if: needs.discover.outputs.tenants != '[]'
    runs-on: ubuntu-latest
    # The environment is what makes the deployer role assumable AND adds the
    # human-approval gate. Configure required reviewers in:
    #   Settings → Environments → aws-datasync-dev → Required reviewers.
    environment: aws-datasync-dev
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        tenant: ${{ fromJson(needs.discover.outputs.tenants) }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC, dev deployer role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_DATASYNC_DEPLOYER_DEV }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-apply-${{ matrix.tenant }}-${{ github.run_id }}

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.8.5

      - name: tofu init
        working-directory: infra/stacks/aws/datasync/tenants/${{ matrix.tenant }}
        run: tofu init -input=false -backend-config=backend.hcl

      - name: tofu apply
        working-directory: infra/stacks/aws/datasync/tenants/${{ matrix.tenant }}
        run: tofu apply -input=false -auto-approve
